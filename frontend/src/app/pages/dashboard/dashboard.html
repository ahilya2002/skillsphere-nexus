<h1>Dashboard</h1>
<p class="subtitle">Quick overview of your SkillSphere activity</p>

<div class="cards">
  <div class="card">
    <div class="card-label">Available Courses</div>
    <div class="card-value">{{ courseCount ?? '—' }}</div>
  </div>

  <div class="card">
    <div class="card-label">Open Jobs</div>
    <div class="card-value">{{ jobCount ?? '—' }}</div>
  </div>

  <div class="card">
    <div class="card-label">Career Plans</div>
    <div class="card-value">{{ careerPlanCount ?? '—' }}</div>
  </div>
</div>
