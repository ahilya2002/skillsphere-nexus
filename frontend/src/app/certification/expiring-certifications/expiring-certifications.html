<h2>Certifications Expiring Within 30 Days</h2>
<table border ="1" cellpadding="8">
  <tr>
    <th>Employee</th>
    <th>Certification</th>
    <th>Expiry</th>
    <th>Status</th>
  </tr>
  <tr *ngFor="let cert of certifications">
    <td>{{ cert.employee?.name }}</td>
    <td>{{ cert.certificationName }}</td>
    <td>{{ cert.expiryDate }}</td>
    <td>{{ cert.status }}</td>
  </tr>
</table>
